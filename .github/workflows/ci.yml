name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: task check (lint + test + build) and visual tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - name: Install dependencies
        run: npm ci
      - name: Lint, test, build
        run: task check
      - name: Install Chromium for the visual tests
        run: npx playwright install --with-deps chromium
      - name: Visual regression (the game in ?still mode and the style guide)
        run: npx playwright test
      - name: Upload the visual diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
