    <text x="101.4" y="42.900000000000006" font-size="32.76" letter-spacing="3.12">HUNGOVERCODERS</text>
    <text x="101.4" y="74.1" font-size="21.840000000000003" font-family="'IM Fell English', 'Palatino Linotype', Georgia, serif" font-style="italic" fill="#b9b0a0">publishers of dubious software</text>
  </g>
</svg>