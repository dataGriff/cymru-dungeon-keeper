<svg xmlns="http://www.w3.org/2000/svg" width="2250" height="2850" viewBox="0 0 2250 2850">
  
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&amp;family=Metamorphous&amp;family=VT323&amp;display=swap');</style>
    <radialGradient id="glow" cx="50%" cy="62%" r="55%">
      <stop offset="0%" stop-color="#5a1a24"/>
      <stop offset="45%" stop-color="#1c1026"/>
      <stop offset="100%" stop-color="#07050c"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#2b2234" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2b2234"/>
    </linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.2 0 0 0 0 0.15 0 0 0 0 0.25 0 0 0 0.18 0"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="2250" height="2850" fill="#0b0812"/>
  <rect width="2250" height="2850" filter="url(#grain)"/>
  <text x="135" y="285" font-family="'Metamorphous', 'Palatino Linotype', Georgia, serif" font-size="108" fill="#f1e9d8">Arawn is away.</text>
  <text x="135" y="441.75" font-family="'Metamorphous', 'Palatino Linotype', Georgia, serif" font-size="108" fill="#ff7a1f">The mortals have heard.</text>
  <foreignObject x="135" y="541.5" width="1980" height="456">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'IM Fell English', 'Palatino Linotype', Georgia, serif;font-size:49.5px;line-height:1.3;color:#b9b0a0;">You are the steward of a hall beneath a cairn, keeping it for a lord who is out with the Hunt and has not said when he will be back. The seam is rich, the Coblynau are willing, and the stair is long. Dig, build, feed what comes through the portal, and keep the Heart beating until the third wave is bones.</div>
  </foreignObject>
  <rect x="129" y="1048.5" width="642" height="427.8" fill="#f1e9d8"/><image x="135" y="1054.5" width="630" height="415.8" preserveAspectRatio="xMidYMid slice" href="shots/hall.png"/><rect x="804" y="1048.5" width="642" height="427.8" fill="#f1e9d8"/><image x="810" y="1054.5" width="630" height="415.8" preserveAspectRatio="xMidYMid slice" href="shots/fight.png"/><rect x="1479" y="1048.5" width="642" height="427.8" fill="#f1e9d8"/><image x="1485" y="1054.5" width="630" height="415.8" preserveAspectRatio="xMidYMid slice" href="shots/manual.png"/>
  <text x="165" y="1795.5" font-family="'IM Fell English', 'Palatino Linotype', Georgia, serif" font-size="46.5" fill="#f1e9d8">◆  Dig the hall out of living rock. Your Coblynau will complain, and dig.</text><text x="165" y="1867.5" font-family="'IM Fell English', 'Palatino Linotype', Georgia, serif" font-size="46.5" fill="#f1e9d8">◆  Nine denizens of Welsh myth, from the Cŵn Annwn to the Afanc, each with a page.</text><text x="165" y="1939.5" font-family="'IM Fell English', 'Palatino Linotype', Georgia, serif" font-size="46.5" fill="#f1e9d8">◆  Mortals who walk through walls if you give them no other road.</text><text x="165" y="2011.5" font-family="'IM Fell English', 'Palatino Linotype', Georgia, serif" font-size="46.5" fill="#f1e9d8">◆  An economy of carried gold, wages, and a Pwca who skims.</text><text x="165" y="2083.5" font-family="'IM Fell English', 'Palatino Linotype', Georgia, serif" font-size="46.5" fill="#f1e9d8">◆  A manual you will actually need. Keep it open. The hall does not forgive.</text>
  <!-- review -->
  <text x="2115" y="2379.75" text-anchor="end" font-family="'IM Fell English', 'Palatino Linotype', Georgia, serif" font-style="italic" font-size="60" fill="#f1e9d8">“I could not tell a hound from a hound of men. Now I can.”</text>
  <text x="2115" y="2465.25" text-anchor="end" font-family="'VT323', 'Courier New', monospace" font-size="48" fill="#b9b0a0">— a steward, briefly</text>
  <!-- requirements -->
  <g transform="translate(135 2436.75)">
    <rect width="870" height="390" fill="#f1e9d8"/>
    <text x="60" y="75" font-family="'Metamorphous', 'Palatino Linotype', Georgia, serif" font-size="45" fill="#0b0812">MINIMUM REQUIREMENTS</text>
    <text x="60" y="120" font-family="'VT323', 'Courier New', monospace" font-size="43.5" fill="#0b0812">386DX or better</text><text x="60" y="171" font-family="'VT323', 'Courier New', monospace" font-size="43.5" fill="#0b0812">4 MB RAM</text><text x="60" y="222" font-family="'VT323', 'Courier New', monospace" font-size="43.5" fill="#0b0812">VGA 256 colours</text><text x="60" y="273" font-family="'VT323', 'Courier New', monospace" font-size="43.5" fill="#0b0812">Sound Blaster or compatible</text><text x="60" y="324" font-family="'VT323', 'Courier New', monospace" font-size="43.5" fill="#0b0812">12 MB hard disk</text><text x="60" y="375" font-family="'VT323', 'Courier New', monospace" font-size="43.5" fill="#0b0812">Mouse recommended. Manual required.</text>
  </g>
  <g transform="translate(1695 2664.75)">
    <rect x="-10" y="-10" width="420" height="165" fill="#f1e9d8"/>
    <rect x="0" y="0" width="2" height="105" fill="#0b0812"/><rect x="9" y="0" width="5" height="105" fill="#0b0812"/><rect x="18" y="0" width="4" height="105" fill="#0b0812"/><rect x="27" y="0" width="3" height="105" fill="#0b0812"/><rect x="36" y="0" width="2" height="105" fill="#0b0812"/><rect x="45" y="0" width="5" height="105" fill="#0b0812"/><rect x="54" y="0" width="4" height="105" fill="#0b0812"/><rect x="63" y="0" width="3" height="105" fill="#0b0812"/><rect x="72" y="0" width="2" height="105" fill="#0b0812"/><rect x="81" y="0" width="5" height="105" fill="#0b0812"/><rect x="90" y="0" width="4" height="105" fill="#0b0812"/><rect x="99" y="0" width="3" height="105" fill="#0b0812"/><rect x="108" y="0" width="2" height="105" fill="#0b0812"/><rect x="117" y="0" width="5" height="105" fill="#0b0812"/><rect x="126" y="0" width="4" height="105" fill="#0b0812"/><rect x="135" y="0" width="3" height="105" fill="#0b0812"/><rect x="144" y="0" width="2" height="105" fill="#0b0812"/><rect x="153" y="0" width="5" height="105" fill="#0b0812"/><rect x="162" y="0" width="4" height="105" fill="#0b0812"/><rect x="171" y="0" width="3" height="105" fill="#0b0812"/><rect x="180" y="0" width="2" height="105" fill="#0b0812"/><rect x="189" y="0" width="5" height="105" fill="#0b0812"/><rect x="198" y="0" width="4" height="105" fill="#0b0812"/><rect x="207" y="0" width="3" height="105" fill="#0b0812"/><rect x="216" y="0" width="2" height="105" fill="#0b0812"/><rect x="225" y="0" width="5" height="105" fill="#0b0812"/><rect x="234" y="0" width="4" height="105" fill="#0b0812"/><rect x="243" y="0" width="3" height="105" fill="#0b0812"/><rect x="252" y="0" width="2" height="105" fill="#0b0812"/><rect x="261" y="0" width="5" height="105" fill="#0b0812"/><rect x="270" y="0" width="4" height="105" fill="#0b0812"/><rect x="279" y="0" width="3" height="105" fill="#0b0812"/><rect x="288" y="0" width="2" height="105" fill="#0b0812"/><rect x="297" y="0" width="5" height="105" fill="#0b0812"/><rect x="306" y="0" width="4" height="105" fill="#0b0812"/><rect x="315" y="0" width="3" height="105" fill="#0b0812"/><rect x="324" y="0" width="2" height="105" fill="#0b0812"/><rect x="333" y="0" width="5" height="105" fill="#0b0812"/><rect x="342" y="0" width="4" height="105" fill="#0b0812"/><rect x="351" y="0" width="3" height="105" fill="#0b0812"/>
    <text x="180" y="150" text-anchor="middle" font-family="'VT323', 'Courier New', monospace" font-size="33" fill="#0b0812">5 024 1 ANNWN 0 06</text>
  </g>
  
