# https://taskfile.dev — run `task --list`
version: '3'

tasks:
  install:
    desc: Install dependencies
    cmds:
      - npm ci
    sources: [package.json, package-lock.json]
    generates: [node_modules/.package-lock.json]

  dev:
    desc: Serve the game with hot reload
    deps: [install]
    cmds:
      - npm run dev

  build:
    desc: Build the static site into dist/
    deps: [install]
    cmds:
      - npm run build

  test:
    desc: Run the sim unit tests (Vitest)
    deps: [install]
    cmds:
      - npm run test

  sprites:
    desc: Render art/figures.json into public/sprites.png
    cmds:
      - node scripts/build-sprites.mjs
    sources: [art/figures.json, scripts/build-sprites.mjs]
    generates: [public/sprites.png, public/sprites.json]

  box:
    desc: Render the box front, back, spine, 3D mock (docs/box) and public/box-front.svg
    cmds:
      - node scripts/build-box.mjs

  bench:
    desc: Performance budgets (pathfinding) without coverage instrumentation
    deps: [install]
    cmds:
      - npm run bench

  lint:
    desc: ESLint + strict TypeScript typecheck
    deps: [install]
    cmds:
      - npm run lint

  check:
    desc: lint + test + build
    cmds:
      - task: lint
      - task: test
      - task: bench
      - task: build
