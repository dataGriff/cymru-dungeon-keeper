[package]
name = "steward-of-annwn"
version = "0.1.0"
description = "Steward of Annwn: a Dungeon Keeper-style hall in Welsh myth"
authors = ["Hungovercoders"]
edition = "2021"

[lib]
name = "annwn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
